# Every linter is on, at its strictest setting. A linter or a rule is switched off only in
# this file, and each one says why. To silence one finding in the code, use
# //nolint:<linter> // <reason>; a nolint without a linter name or without a reason fails.
version: "2"

linters:
  default: all
  disable:
    # Layout taste, not quality: where blank lines go is decided by gofmt and the reader.
    - wsl
    - wsl_v5
    - nlreturn
    # Forbids "if err := f(); err != nil", the form the Go documentation itself teaches.
    - noinlineerr
    # Demands every field in every struct literal. Go's zero values are part of the
    # language, and the code relies on them on purpose.
    - exhaustruct
    - exhaustruct_v5
    # Replaced by gomodguard_v2, which is on. The old one only prints a deprecation notice.
    - gomodguard
    # Demands tests in a package of their own. The 100% coverage gate needs tests that
    # reach unexported code.
    - testpackage

  settings:
    # Only these modules may be imported. A new dependency has to be added here, which makes
    # it a decision and not an accident.
    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/SpliceFS/server
            - github.com/SpliceFS/common
            - go.yaml.in/yaml/v3
            - golang.org/x/crypto
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      check:
        - switch
        - mapliteral
        - typeswitch
    gosec:
      excludes:
        # "File inclusion via variable": a file server opens the paths its configuration and
        # its requests name. Each such path is confined by the share code, which is tested.
        - G304
    # The limit SonarQube uses for the same measure.
    gocognit:
      min-complexity: 15
    gocritic:
      enable-all: true
      settings:
        # The check wants every argument over 80 bytes passed by pointer, for speed. An
        # options struct is passed by value on purpose: the function gets its own copy and
        # cannot change the caller's, and it is passed once, not in a loop. The limit is
        # raised far enough for those and still catches a copy that would cost.
        hugeParam:
          sizeThreshold: 256
    govet:
      enable-all: true
      disable:
        # Orders struct fields by size to save padding. Fields are ordered for the reader,
        # and no struct here exists often enough for the bytes to matter.
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      enable-all-rules: true
      rules:
        # Each of these repeats a linter that is on and does the same job with better
        # judgment: mnd and goconst for constants, lll for line length, gocognit, cyclop
        # and funlen for the size and complexity of a function.
        - name: add-constant
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: function-length
          disabled: true
        # Counts the exported types of a package against a fixed number. A package of
        # message types has as many as the protocol has messages.
        - name: max-public-structs
          disabled: true
    staticcheck:
      checks:
        - all
    # The wire format and the configuration files use snake_case keys. This keeps them so.
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
    # Names every Go programmer reads without thinking. Any other name must say what it holds.
    varnamelen:
      ignore-names:
        - i
        - n
        - t
        - b
        - r
        - w
        - ok
        - id
        - tt
        - mu
        - wg
        - fs

  exclusions:
    rules:
      # Tests repeat themselves on purpose and build their own errors, numbers and strings.
      - path: _test\.go
        linters:
          - dupl
          - err113
          - funlen
          - goconst
          - gosec
          - mnd
          - wrapcheck

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
