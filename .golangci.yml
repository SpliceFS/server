version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        # Reading files whose paths come from the operator's configuration is the
        # purpose of these programs.
        - G304
  exclusions:
    rules:
      # Tests create scratch files and directories with ordinary permissions.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
