name: Fuzz
# Every job has a time limit: 3 times its longest run, so a hang fails in minutes.

# Fuzzing finds bugs over time; it does not prove a change, so no pull request waits for it. It
# runs on main every day, and on request (Run workflow on the Actions page).
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job for each package that has fuzz targets, each fuzzing its targets one after another,
  # so the fuzzing takes as long as the package with the most targets and not the sum of all of
  # them. A job for each target would be more jobs than the runners run at once. The packages
  # are found in the code (make fuzz-packages), so a new Fuzz function, or a first one in a
  # package, gets its job without an edit here.
  fuzz-packages:
    name: Fuzz packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: List the packages with fuzz targets as JSON
        id: list
        run: |
          lines="$(make -s fuzz-packages)"
          printf 'packages=%s\n' "$(printf '%s\n' "$lines" | jq -R -n -c '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: fuzz-packages
    name: Fuzz (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.fuzz-packages.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Fuzz every target of the package briefly
        run: make fuzz FUZZ_PACKAGE="$PACKAGE"
      # Go writes an input that fails a target to testdata/fuzz in the package's folder. The
      # log shows where; this keeps the folder, which is gone with the runner. An artifact name
      # may not hold a /.
      - name: Name the artifact of the failing input
        id: input
        if: failure()
        run: printf 'name=fuzz-input-%s\n' "$(printf '%s' "$PACKAGE" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.input.outputs.name }}
          path: ${{ matrix.package }}/testdata/fuzz
          if-no-files-found: ignore

  # A failed run of this workflow opens an issue assigned to the account in the repository
  # variable ALERT_ASSIGNEE, so that someone gets an email; nobody watches a scheduled run.
  alert:
    name: Report a failure
    needs: [fuzz-packages, fuzz]
    if: ${{ failure() }}
    permissions:
      issues: write
    uses: SpliceFS/.github/.github/workflows/report-failure-v1.yml@main
    with:
      assignee: ${{ vars.ALERT_ASSIGNEE }}
