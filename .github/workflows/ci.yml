name: CI
# Every job has a time limit: 3 times its longest run, so a hang fails in minutes.

# Only pull requests are tested. main gets nothing but branches that passed here while they
# sat on its tip, so a run on main would test the same files a second time.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request is tested only when its branch sits on the tip of main. Then the merge adds
  # nothing that was not tested, and nothing is tested again after it: not on main, not in the
  # release. A branch that is behind fails here at once, before any long job starts. The bot
  # rebuilds every open branch when main moves, which starts the checks again.
  tip:
    name: On the tip of main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The branch contains the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.label }}
        run: |
          behind="$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq .behind_by)"
          if [ "$behind" != "0" ]; then
            echo "::error::This branch is $behind commits behind $BASE. Rebase it on the tip of $BASE; nothing is tested until then."
            exit 1
          fi
          echo "The branch contains the tip of $BASE."

  # Every part is a make target that runs in our images (see the Makefile), so each job is
  # the command a developer runs on any machine that has Docker. The parts need nothing from
  # each other and start at once. The runners hold no Go and no packages of their own: the
  # images do.
  static:
    needs: tip
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Format, vet, module files, ShellCheck and golangci-lint for every system
        run: make static

  unit:
    needs: tip
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Codecov upload signs in with the OIDC token instead of a stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Tests with the 100% coverage gate, and the tests of the scripts
        run: make unit
      # The upload must never fail the build, for example before the organization is enabled
      # on Codecov. Forks cannot get an OIDC token for this repository.
      - name: Upload coverage to Codecov
        if: github.repository == 'SpliceFS/server' && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.out
          disable_search: true
          fail_ci_if_error: false

  race:
    needs: tip
    name: Tests with the race detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Tests with the race detector
        run: make race

  # Every program for every system compiles. The release builds the files it ships itself; the
  # packages repository builds packages from the release archives, not from this run.
  build:
    needs: tip
    name: Build every program
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Build for linux, freebsd and darwin on amd64 and arm64
        run: make build-all

  # The parts of the integration test are listed by the client that is tested (make -s
  # integration-parts): its compatibility runs, and each group of its cluster scenarios. The
  # jobs of the next job are made from that list, so a group is added to the client and nowhere
  # else.
  integration-parts:
    needs: tip
    name: The parts of the integration test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List the parts as JSON
        id: parts
        run: |
          lines="$(make -s integration-parts)"
          printf 'parts=%s\n' "$(printf '%s\n' "$lines" | jq -R -n -c '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  # The rule this proves: with the same first version number, a client works with every
  # server whose second number is equal or higher. So a change of this server must not break
  # the newest released client it has to serve. The client mounts for real, as root, in a
  # container that has FUSE. One job runs each part, so that no job is longer than the others.
  integration:
    needs: integration-parts
    name: The real client against this server (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.integration-parts.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The container mounts through the /dev/fuse of the runner itself, and that device
      # appears when the fuse kernel module is loaded.
      - name: The FUSE device exists
        run: test -c /dev/fuse || sudo modprobe fuse
      # This part runs as root and keeps caches of its own (ROOT_CACHE in the Makefile).
      - uses: ./.github/actions/go-cache
        with:
          folder: .cache/root
      - name: The real client against this server
        run: make integration INTEGRATION_PART=${{ matrix.part }}

  # A macOS runner cannot run Linux containers, so this is the one part that runs on the
  # machine itself, with the Go release that is current.
  macos:
    needs: tip
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Tests with the 100% coverage gate, then with the race detector
        run: make unit-here race-here

  # The FreeBSD tests are one workflow, because the Daily workflow runs them too and saves the
  # Go caches that this run restores (see freebsd-tests.yml). A pull request never saves.
  freebsd-tests:
    needs: tip
    name: FreeBSD tests
    uses: ./.github/workflows/freebsd-tests.yml
    with:
      save: false

  # The one check a branch must pass. A job that did not run counts as failed: a job is
  # skipped only when one it needs failed. A new job is added to the list when it is added
  # above, and nowhere else.
  all-checks:
    name: All checks
    needs:
      - tip
      - static
      - unit
      - race
      - build
      - integration-parts
      - integration
      - macos
      - freebsd-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s\n' "$NEEDS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::At least one job did not succeed."
            exit 1
          fi
