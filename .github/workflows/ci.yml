name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov upload signs in with the OIDC token instead of a stored secret.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # Run as root because that is the configuration the coverage gate is measured
      # in locally (make check-linux runs as root inside its container).
      - name: Format, vet, tests with race detector, 100% coverage
        run: sudo -E env "PATH=$PATH" make check
      # One report per commit is enough, so only the stable Go release uploads. Forks
      # cannot get an OIDC token for this repository. The upload must never fail the
      # build, for example before the organization is enabled on Codecov.
      - name: Upload coverage to Codecov
        if: matrix.go == 'stable' && github.repository == 'SpliceFS/server' && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.out
          disable_search: true
          fail_ci_if_error: false
      - name: Build
        run: make build

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Format, vet, tests with race detector, 100% coverage
        run: make check
      - name: Build
        run: make build

  package:
    name: Packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Build the packages
        run: make package
      - name: Install and remove each package in a clean system of its kind
        run: make package-test
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64'
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/alpine/
          if-no-files-found: error

  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
