name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # Run as root because that is the configuration the coverage gate is measured
      # in locally (make check-linux runs as root inside its container).
      - name: Format, vet, tests with race detector, 100% coverage
        run: sudo -E env "PATH=$PATH" make check
      - name: Build
        run: make build

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Format, vet, tests with race detector, 100% coverage
        run: make check
      - name: Build
        run: make build

  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
