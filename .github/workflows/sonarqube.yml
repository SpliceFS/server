name: SonarQube

# Code quality and security rating on SonarQube Cloud. The job does nothing until the
# repository secret SONAR_TOKEN exists; see CONTRIBUTING.md for the one-time setup.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check that SonarQube is configured
        id: gate
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "SONAR_TOKEN is not set; skipping."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0   # the scanner needs history to attribute new code
      - uses: ./.github/actions/go-cache
        if: steps.gate.outputs.enabled == 'true'
      # The same part that CI runs, in the same image; it leaves coverage.out where
      # sonar-project.properties looks for it.
      - name: Tests with coverage
        if: steps.gate.outputs.enabled == 'true'
        run: make unit
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        if: steps.gate.outputs.enabled == 'true'
