name: Scorecard

on:
  push:
    branches: [develop]
  schedule:
    # Weekly, so the public score tracks changes outside the code (settings, new releases).
    # Not on the hour, when scheduled runs are most likely to be delayed or dropped.
    - cron: "23 5 * * 2"
  # Branch protection is one of the things scored, so re-score when it changes.
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload to code scanning.
      security-events: write
      # Publishing the score signs the request with the workflow's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Published results are only accepted from a job that has nothing but these
      # actions in it, so no other steps, environment variables or containers here.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
