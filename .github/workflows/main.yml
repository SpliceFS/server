name: Main

# When main moves, the new version is tagged, which starts the release, and every open pull
# request is rebuilt on the new tip. See https://github.com/SpliceFS/.github
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  main:
    uses: SpliceFS/.github/.github/workflows/main-moved-v1.yml@main
    secrets:
      bot-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  # A failed run of this workflow opens an issue assigned to the account in the repository
  # variable ALERT_ASSIGNEE, so that someone gets an email; GitHub sends none for runs the
  # bots start. Pull requests are left out: their author sees the failed check there.
  alert:
    name: Report a failure
    needs: [main]
    if: ${{ failure() && github.event_name != 'pull_request' }}
    permissions:
      issues: write
    uses: SpliceFS/.github/.github/workflows/report-failure-v1.yml@main
    with:
      assignee: ${{ vars.ALERT_ASSIGNEE }}
