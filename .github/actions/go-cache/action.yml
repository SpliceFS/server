name: Go caches
description: Restores, and by default saves, the module and build caches that the Go parts mount into their image.

# Every job that runs Go in the image does the same three things here, so they are written
# once. The folders are the ones the Makefile mounts (CACHE). Each job keeps its own entry: a
# race build, a test build and a lint run fill the build cache with different objects, and one
# shared entry would hold only whichever job finished first.
inputs:
  save:
    description: >-
      "false" restores the caches and never saves them, for a job whose caches are not worth
      the time a save takes. Composite action inputs are strings.
    default: "true"

runs:
  using: composite
  steps:
    # The image is named in the Makefile and nowhere else; a new image starts with new caches.
    # The save and the restore step below read the same three facts from here.
    - name: Name the Go image and the cache entry
      id: cache
      shell: bash
      run: |
        # A change of go.sum starts from the caches of the last one; Go adds what is missing.
        prefix="go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-$(make -s go-image)-"
        {
          echo "prefix=$prefix"
          # Braces: the hash starts with letters and digits, and $prefix<hash> would name another variable.
          echo "key=${prefix}${{ hashFiles('go.sum') }}"
          printf 'path<<END_OF_PATHS\n%s\n%s\nEND_OF_PATHS\n' .cache/gomod .cache/gobuild
        } >> "$GITHUB_OUTPUT"
    - name: Restore and save the caches
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache.outputs.path }}
        key: ${{ steps.cache.outputs.key }}
        restore-keys: ${{ steps.cache.outputs.prefix }}
    - name: Restore the caches
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache.outputs.path }}
        key: ${{ steps.cache.outputs.key }}
        restore-keys: ${{ steps.cache.outputs.prefix }}
